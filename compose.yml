# Local Midnight devnet stack for KYCPass.
#
# Brings up the three Midnight services used during development:
#   - midnight-node       full node + RPC        → host port 9944
#   - midnight-indexer    ledger/indexer API     → host port 8088
#   - midnight-proof-server  ZK proof generation → host port 6300
#
# Usage:
#   docker compose up -d          # start the stack
#   docker compose down           # stop it
#
# NOTE: image tags track the official Midnight "devnet" images. If the tag is
# out of date for the installed `compact` toolchain, adjust it to the version
# used by your current `create-mn-app` setup. Configuration is minimal so the
# services boot and talk to each other on the overlay network; the wallet CLI
# (src/*.ts) targets these host ports via .env.

services:
  midnight-node:
    image: midnightnetwork/midnight-node:latest
    platform: linux/amd64
    ports:
      - "9944:9944"
    environment:
      MIDNIGHT_RPC_PORT: 9944
      MIDNIGHT_CONNECT_TO_GRPCPROXY: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9944/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  midnight-indexer:
    image: midnightnetwork/midnight-indexer:latest
    platform: linux/amd64
    ports:
      - "8088:8088"
    depends_on:
      midnight-node:
        condition: service_healthy
    environment:
      MIDNIGHT_NODE_URL: http://midnight-node:9944
      MIDNIGHT_LISTEN_ADDR: 0.0.0.0:8088
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  midnight-proof-server:
    image: midnightnetwork/midnight-proof-server:latest
    platform: linux/amd64
    ports:
      - "6300:6300"
    environment:
      MIDNIGHT_PROOF_SERVER_LISTEN_ADDR: 0.0.0.0:6300