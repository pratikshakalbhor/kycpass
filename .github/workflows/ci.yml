name: CI

on:
  push:
    branches: [main, master, release/21-commits]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json found — scaffolding-only commit, skipping install."
          fi

      - name: Setup Compact Compiler
        uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: '0.5.1'

      - name: Compile contract (generates managed/)
        run: |
          if [ -f package.json ]; then
            npm run compile
          else
            echo "No package.json found — skipping contract compilation."
          fi

      - name: Lint / typecheck
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present
